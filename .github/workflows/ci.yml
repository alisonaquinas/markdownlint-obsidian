name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - run: bun install --frozen-lockfile

      # Build core first so its dist/ type declarations are available for
      # the CLI typecheck (CLI imports from markdownlint-obsidian/engine).
      - name: Build core (generates dist/ for downstream typechecks)
        run: bun run --filter markdownlint-obsidian build

      - name: Type check (all packages)
        run: bun run --filter '*' typecheck

      - name: Lint
        run: bun run lint

      - name: Unit + integration tests (all packages)
        run: bun run --filter '*' test

      - name: BDD acceptance tests
        run: bun run test:bdd

      - name: Dogfood docs/ and extension/docs/
        run: bun run test:dogfood

      - name: Build (all packages)
        run: bun run --filter '*' build

      - name: Extension host smoke test
        run: xvfb-run -a bun run --cwd extension test:extension-host

      - name: Verify extension package metadata
        run: bun run --cwd extension package:check

      - name: Package extension VSIX
        run: bun run --cwd extension package

      - name: Verify package tarball contents
        run: bun run test:packaging

      - name: Build and test GitHub Action
        run: |
          cd action
          npm install --workspaces=false
          npm run build
          bun test --timeout 30000
          mkdir -p ../tmp-action-bin
          printf '#!/usr/bin/env sh\necho "[]"\n' > ../tmp-action-bin/npx
          chmod +x ../tmp-action-bin/npx
          PATH="$(pwd)/../tmp-action-bin:$PATH" node dist/main.mjs
        env:
          INPUT_GLOBS: "**/*.md"
          INPUT_FORMAT: json
          GITHUB_WORKSPACE: ${{ github.workspace }}

  dogfood-published:
    # Lint docs/ and extension/docs/ using the published
    # markdownlint-obsidian-cli package on npmjs.org (not the local source).
    # This catches release regressions that only manifest in the packaged
    # artifact (missing files, broken bin entry, bad workspace dep resolution,
    # etc.) and also verifies that consumers can install and run the CLI from a
    # clean environment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Lint docs/ and extension/docs/ with published CLI
        run: npm run test:dogfood:published

  publish-dry-run:
    # Dry-run the release archive path (build → prepare-publish.mjs → npm pack
    # --dry-run) for both packages on every PR and push.  Exercises the same
    # dependency rewrite and tarball metadata path as a real release without
    # touching any registry.
    needs: build-and-test
    uses: ./.github/workflows/_publish-packages.yml
    permissions:
      contents: read
    with:
      dry_run: true
      tag_name: ""
