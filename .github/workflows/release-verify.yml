name: Release verify

on:
  release:
    types: [published]

jobs:
  verify-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for publish workflows to complete and CDN to propagate
        # npm-publish takes 3-10 min; add buffer for CDN propagation
        run: sleep 600

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install cli from npmjs.org and verify version
        if: startsWith(github.event.release.tag_name, 'markdownlint-obsidian-cliv')
        run: |
          VERSION="${GITHUB_REF_NAME#markdownlint-obsidian-cliv}"
          npm install -g "markdownlint-obsidian-cli@${VERSION}"
          OUT=$(markdownlint-obsidian --version)
          echo "$OUT"
          echo "$OUT" | grep -q "${VERSION}"

      - name: Install core from npmjs.org and verify exports
        if: startsWith(github.event.release.tag_name, 'markdownlint-obsidianv')
        run: |
          VERSION="${GITHUB_REF_NAME#markdownlint-obsidianv}"
          mkdir /tmp/core-export-test && cd /tmp/core-export-test
          npm init -y
          npm install "markdownlint-obsidian@${VERSION}"
          # Verify every documented subpath export from a clean consumer project,
          # not from the monorepo checkout. This catches missing dist files and
          # package `exports` drift after publish.
          node --input-type=module <<'EOF'
          await import('markdownlint-obsidian');
          await import('markdownlint-obsidian/api');
          await import('markdownlint-obsidian/rules');
          await import('markdownlint-obsidian/engine');
          EOF

      - name: Audit core npm signatures (verifies provenance)
        if: startsWith(github.event.release.tag_name, 'markdownlint-obsidianv')
        run: |
          VERSION="${GITHUB_REF_NAME#markdownlint-obsidianv}"
          mkdir /tmp/core-audit-test && cd /tmp/core-audit-test
          npm init -y
          npm install "markdownlint-obsidian@${VERSION}"
          npm audit signatures

      - name: Audit npm signatures (verifies provenance)
        if: startsWith(github.event.release.tag_name, 'markdownlint-obsidian-cliv')
        run: |
          VERSION="${GITHUB_REF_NAME#markdownlint-obsidian-cliv}"
          mkdir /tmp/audit-test && cd /tmp/audit-test
          npm init -y
          npm install "markdownlint-obsidian-cli@${VERSION}"
          npm audit signatures
