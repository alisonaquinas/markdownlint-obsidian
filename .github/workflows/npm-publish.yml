name: Publish to npm

# Thin caller. Package deployment is tag-driven: pushing a package tag publishes
# the matching npm package through the reusable workflow.

on:
  push:
    tags:
      - "markdownlint-obsidianv*"
      - "markdownlint-obsidian-cliv*"

jobs:
  publish:
    uses: ./.github/workflows/_publish-packages.yml
    permissions:
      id-token: write # propagated to the reusable workflow for --provenance
      contents: write
    with:
      dry_run: false
      tag_name: ${{ github.ref_name }}
