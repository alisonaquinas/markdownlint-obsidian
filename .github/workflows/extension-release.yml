name: Publish VS Code extension

on:
  push:
    tags:
      - "ext-v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      is_test_tag: ${{ steps.tag.outputs.is_test_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.12"

      - run: bun install --frozen-lockfile

      - name: Detect test tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *test* ]]; then
            echo "is_test_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_test_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build extension
        run: bun run --cwd extension build

      - name: Verify extension package metadata
        run: bun run --cwd extension package:check

      - name: Package VSIX
        run: bunx --bun vsce package --no-dependencies --out ../markdownlint-obsidian-vscode-${{ github.ref_name }}.vsix
        working-directory: extension

      - name: Write SHA-256 checksums
        run: sha256sum *.vsix > checksums-${{ github.ref_name }}.sha256

      - name: Verify SHA-256 checksums
        run: sha256sum -c checksums-${{ github.ref_name }}.sha256

      - name: Attest VSIX provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "*.vsix"

      - uses: actions/upload-artifact@v7
        with:
          name: extension-vsix-${{ github.ref_name }}
          path: |
            *.vsix
            checksums-${{ github.ref_name }}.sha256

  publish:
    needs: package
    if: needs.package.outputs.is_test_tag == 'false'
    runs-on: ubuntu-latest
    environment: vsce-publish
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-vsix-${{ github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install vsce
        run: npm install -g @vscode/vsce@3.9.1

      - name: Verify checksum
        run: sha256sum -c checksums-${{ github.ref_name }}.sha256

      - name: Verify Marketplace publisher PAT
        run: vsce verify-pat "${VSCE_PUBLISHER_NAME}" --pat "${VSCE_PUBLISHER_PAT}"
        env:
          VSCE_PUBLISHER_NAME: ${{ vars.VSCE_PUBLISHER_NAME }}
          VSCE_PUBLISHER_PAT: ${{ secrets.VSCE_PUBLISHER_PAT }}

      - name: Publish VSIX
        run: vsce publish --packagePath *.vsix --pat "${VSCE_PUBLISHER_PAT}"
        env:
          VSCE_PUBLISHER_PAT: ${{ secrets.VSCE_PUBLISHER_PAT }}
